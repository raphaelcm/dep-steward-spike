name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Needs a secret, as many CIs do
        env:
          SPIKE_CI_ONLY: ${{ secrets.SPIKE_CI_ONLY }}
        run: test -n "$SPIKE_CI_ONLY" || { echo "SPIKE_CI_ONLY is not set"; exit 1; }

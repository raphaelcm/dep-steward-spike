name: probe-apt
on: workflow_dispatch
jobs:
  apt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - run: python3 -c "import nacl; print('nacl preinstalled', nacl.__version__)" || echo "nacl not preinstalled"
      - run: cat /etc/apt/apt-mirrors.txt 2>/dev/null || true; getent hosts security.ubuntu.com || echo "no DNS for security.ubuntu.com"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-nacl && python3 -c "import nacl; print('installed ok')"

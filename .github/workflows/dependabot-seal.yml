# dep-steward: copies the secrets CI reads into Dependabot's own secret store,
# sealed so no person or log sees a value. /dep-steward:install runs it; it
# does nothing on its own. The sealing step is dep-steward's, at the commit
# pinned below; it is handed this job's secrets and seals only the ones CI
# reads.
name: Dependabot seal CI secrets

on:
  workflow_dispatch:
    inputs:
      public-key:
        description: The Dependabot secret store's public key (the install skill fills it in)
        required: true
        type: string

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: raphaelcm/dep-steward/actions/seal@d75206809d39029a9ae6abd2582e300ad7851c16 # v0.18.1
        with:
          ci-name: "CI"
          public-key: ${{ inputs.public-key }}
          secrets: ${{ toJSON(secrets) }}
